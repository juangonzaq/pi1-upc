# Configuración base. Los perfiles (configs/profiles/*.yaml) sobrescriben estas claves.
workspace: data/workspace
template: configs/template_v1.json
abbreviations: configs/abbreviations.yaml
seed: 1234
device: auto            # auto | cpu | mps | cuda

model:
  base_checkpoint: microsoft/trocr-small-handwritten
  alternative_checkpoint: microsoft/trocr-base-handwritten
  aggregation: mean_logprob   # mean_logprob (media geométrica) | min_prob (probabilidad mínima por token)
  batch_size: 32
  max_new_tokens: 24

recognition:
  max_retries: 2
  retry_backoff_s: 0.2

preprocessing:
  orb_features: 6000
  work_scale: 0.35

segmentation:
  inset_px: 4
  binarize_threshold: 165
  empty_ink_ratio: 0.006     # firmas
  min_ink_px: 60             # celda vacía si tiene menos píxeles de tinta
  min_component_px: 12
  repeat_mark_max_width_ratio: 0.18
  repeat_mark_min_height_ratio: 0.85

routing:
  repeat_mark_forces_review: true

rules:
  deviation_limit_pct: 2.0
  deviation_pct_tolerance: 0.15
  max_shift_hours: 13.0
  max_angle_diff_deg: 10.0

dataset:
  split: [0.70, 0.15, 0.15]
  unseen_operators: 2
  sprint1_sample: 30
  reference_subset: 50
  literal_max_distance: 0.5
  required_formats: 2000

training:
  lora: false
  lr: 5.0e-5
  weight_decay: 0.01
  batch_size: 16
  max_steps: 1500
  eval_every: 150
  patience: 3
  warmup_ratio: 0.05
  augment: true

calibration:
  temperatures: [0.25, 0.35, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.25, 1.4, 1.6, 1.8, 2.0, 2.5, 3.0, 4.0, 5.0]
  ece_bins: 15

cycle:
  replay_ratio: 2.0          # ejemplos históricos por cada corrección
  include_confirmed_positives: true
  max_steps: 400
  eval_every: 100
  patience: 2
  lr: 3.0e-5
