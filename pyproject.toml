[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perfo"
version = "0.1.0"
description = "Perforación IA: núcleo de digitalización de formatos manuscritos de perforación de taladros largos"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.46",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    "jiwer>=3.0",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "typer>=0.12",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]
datasets = ["datasets>=2.20"]
lora = ["peft>=0.12"]
mlflow = ["mlflow>=2.15"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
perfo = "perfo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: pruebas que cargan el modelo TrOCR real"]
